<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Grind Advisor Cloud</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Grind Advisor</div>
        <h1>Cloud</h1>
      </div>
      <button id="logoutBtn" class="ghost hidden">Logout</button>
    </header>

    <section id="authView" class="stack">
      <div class="card">
        <h2>Anmelden</h2>
        <input id="loginEmail" type="email" placeholder="E-Mail" />
        <input id="loginPassword" type="password" placeholder="Passwort" />
        <button id="loginBtn">Login</button>
      </div>
      <div class="card">
        <h2>Registrieren</h2>
        <input id="registerName" placeholder="Name" />
        <input id="registerEmail" type="email" placeholder="E-Mail" />
        <input id="registerPassword" type="password" placeholder="Passwort (min. 8 Zeichen)" />
        <button id="registerBtn">Konto erstellen</button>
      </div>
    </section>

    <section id="appView" class="hidden">
      <div class="welcome card">
        <div>
          <div class="eyebrow">Eingeloggt als</div>
          <strong id="meName">–</strong>
        </div>
        <div class="stats">
          <div><span id="statBeans">0</span><small>Bohnen</small></div>
          <div><span id="statShots">0</span><small>Shots</small></div>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-tab="beans">Bohnen</button>
        <button class="tab" data-tab="shots">Shots</button>
        <button class="tab" data-tab="predict">Empfehlung</button>
        <button class="tab" data-tab="import">Import</button>
      </nav>

      <section id="tab-beans" class="tab-panel">
        <div class="card">
          <h2>Neue Bohne</h2>
          <input id="beanName" placeholder="Name" />
          <input id="beanRoaster" placeholder="Rösterei" />
          <input id="beanOrigin" placeholder="Herkunft" />
          <select id="beanRoast">
            <option>Hell</option>
            <option selected>Mittel</option>
            <option>Dunkel</option>
          </select>
          <textarea id="beanCupping" placeholder="Notizen"></textarea>
          <button id="saveBeanBtn">Bohne speichern</button>
        </div>
        <div class="card">
          <h2>Meine Bohnen</h2>
          <div id="beansList" class="list"></div>
        </div>
      </section>

      <section id="tab-shots" class="tab-panel hidden">
        <div class="card">
          <h2>Shot speichern</h2>
          <select id="shotBean"></select>
          <div class="grid2">
            <input id="shotGrind" type="number" step="0.1" placeholder="Mahlgrad" />
            <input id="shotTime" type="number" step="0.1" placeholder="Ist-Zeit (s)" />
            <input id="shotTarget" type="number" step="0.1" placeholder="Zielzeit (s)" />
            <input id="shotDose" type="number" step="0.1" placeholder="Dosis (g)" />
            <input id="shotYield" type="number" step="0.1" placeholder="Yield (g)" />
            <input id="shotMachine" placeholder="Maschine" />
          </div>
          <textarea id="shotNotes" placeholder="Notizen"></textarea>
          <button id="saveShotBtn">Shot speichern</button>
        </div>
        <div class="card">
          <h2>Meine letzten Shots</h2>
          <div id="shotsList" class="list"></div>
        </div>
      </section>

      <section id="tab-predict" class="tab-panel hidden">
        <div class="card">
          <h2>Empfehlung</h2>
          <select id="predictBean"></select>
          <div class="grid2">
            <input id="predictTarget" type="number" step="0.1" placeholder="Zielzeit (s)" value="27" />
            <input id="predictDose" type="number" step="0.1" placeholder="Dosis (g)" value="18" />
          </div>
          <button id="predictBtn">Empfehlung berechnen</button>
          <div id="predictResult" class="result hidden"></div>
        </div>
      </section>

      <section id="tab-import" class="tab-panel hidden">
        <div class="card">
          <h2>JSON Import</h2>
          <p class="muted">Unterstützt wird dein Shot-JSON mit <code>datapoints</code>, <code>timeInShot</code> und <code>shotWeight</code>.</p>
          <input id="importFile" type="file" accept=".json,application/json" />
          <button id="parseImportBtn">Datei prüfen</button>
          <pre id="importResult" class="result hidden"></pre>
        </div>
      </section>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script>
    window.GRIND_ADVISOR_API = "https://grind-advisor-pro-test.onrender.com/api";
  </script>
  <script src="./app.js"></script>
</body>
</html>
